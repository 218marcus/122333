<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraSole</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
      color: #263238;
    }

    .app {
      max-width: 850px;
      margin: auto;
    }

    header {
      padding: 26px;
      color: white;
      border-radius: 20px;
      background: linear-gradient(135deg, #087f8c, #06a77d);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    header p {
      margin: 0;
    }

    .card {
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 14px #d8d8d8;
    }

    #status {
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      background: #d9f7e5;
      color: #176b36;
    }

    #status.warning {
      background: #ffe69c;
      color: #795600;
    }

    #status.danger {
      background: #ffb3b3;
      color: #8b0000;
    }

    .small {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: normal;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #startButton {
      color: white;
      background: #087f8c;
    }

    #resetButton {
      background: #e5e7eb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #countdown {
      margin: 18px 0 0;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #087f8c;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .foot {
      position: relative;
      width: 150px;
      height: 275px;
      margin: 20px auto;
      border: 4px solid #d5b59c;
      border-radius: 75px 75px 45px 45px;
      background: #ead2bd;
    }

    .point {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 3px solid white;
      border-radius: 50%;
      background: #a8b0b5;
      transition: 0.4s;
    }

    #toe {
      top: 25px;
      left: 57px;
    }

    #met1 {
      top: 90px;
      left: 28px;
    }

    #met5 {
      top: 90px;
      right: 22px;
    }

    #heel {
      bottom: 25px;
      left: 57px;
    }

    .point-label {
      position: absolute;
      width: 90px;
      font-size: 11px;
      text-align: center;
      color: #604734;
    }

    #toeLabel {
      top: 1px;
      left: 92px;
    }

    #met1Label {
      top: 95px;
      left: -85px;
    }

    #met5Label {
      top: 95px;
      left: 88px;
    }

    #heelLabel {
      bottom: 30px;
      left: 92px;
    }

    .data {
      line-height: 2.2;
      font-size: 16px;
    }

    .data span {
      float: right;
      font-weight: bold;
      color: #087f8c;
    }

    .tip {
      line-height: 1.7;
      color: #555;
    }

    .notice {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 650px) {
      body {
        padding: 10px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <h1>AuraSole</h1>
      <p>糖尿病足日常風險監測原型</p>
    </header>

    <section class="card">
      <div id="status">
        尚未量測
        <span class="small">
          請按下「開始量測」
        </span>
      </div>

      <div class="controls">
        <button id="startButton">
          開始量測
        </button>

        <button id="resetButton">
          重新設定
        </button>
      </div>

      <div id="countdown"></div>
    </section>

    <div class="grid">

      <section class="card">
        <h2>DFU Risk Map</h2>

        <div class="foot">
          <div id="toe" class="point"></div>
          <div id="met1" class="point"></div>
          <div id="met5" class="point"></div>
          <div id="heel" class="point"></div>

          <div id="toeLabel" class="point-label">
            大拇趾
          </div>

          <div id="met1Label" class="point-label">
            第一蹠骨
          </div>

          <div id="met5Label" class="point-label">
            第五蹠骨
          </div>

          <div id="heelLabel" class="point-label">
            腳跟
          </div>
        </div>

        <p class="notice">
          灰色：未量測　綠色：正常　黃色：需留意　紅色：高風險
        </p>
      </section>

      <section class="card">
        <h2>量測數據</h2>

        <div class="data">
          左腳溫度：
          <span id="leftTemp">--</span><br>

          右腳溫度：
          <span id="rightTemp">--</span><br>

          左右溫差：
          <span id="tempDifference">--</span><br>

          最大壓力：
          <span id="maxPressure">--</span><br>

          數據來源：
          <span id="dataSource">模擬</span>
        </div>
      </section>

    </div>

    <section class="card">
      <h2>系統建議</h2>

      <p id="tip" class="tip">
        尚未進行量測。
      </p>

      <p class="notice">
        本頁面是展示原型，數據為模擬資料，不構成醫療診斷。
      </p>
    </section>

  </main>

  <script>
    const startButton =
      document.getElementById("startButton");

    const resetButton =
      document.getElementById("resetButton");

    const statusBox =
      document.getElementById("status");

    const countdownBox =
      document.getElementById("countdown");

    const leftTempBox =
      document.getElementById("leftTemp");

    const rightTempBox =
      document.getElementById("rightTemp");

    const differenceBox =
      document.getElementById("tempDifference");

    const pressureBox =
      document.getElementById("maxPressure");

    const dataSourceBox =
      document.getElementById("dataSource");

    const tipBox =
      document.getElementById("tip");

    const points = [
      document.getElementById("toe"),
      document.getElementById("met1"),
      document.getElementById("met5"),
      document.getElementById("heel")
    ];

    let timer = null;
    let seconds = 0;

    function setPointColor(color) {
      points.forEach(function(point) {
        point.style.background = color;
      });
    }

    function resetPage() {
      clearInterval(timer);

      seconds = 0;

      startButton.disabled = false;
      countdownBox.innerText = "";

      statusBox.className = "";
      statusBox.innerHTML = `
        尚未量測
        <span class="small">
          請按下「開始量測」
        </span>
      `;

      leftTempBox.innerText = "--";
      rightTempBox.innerText = "--";
      differenceBox.innerText = "--";
      pressureBox.innerText = "--";
      dataSourceBox.innerText = "模擬";

      tipBox.innerText = "尚未進行量測。";

      setPointColor("#a8b0b5");
    }

    function startMeasurement() {
      clearInterval(timer);

      seconds = 30;
      startButton.disabled = true;

      statusBox.className = "";
      statusBox.innerHTML = `
        正在量測
        <span class="small">
          請保持坐姿並避免移動
        </span>
      `;

      setPointColor("#087f8c");

      countdownBox.innerText =
        "剩餘 " + seconds + " 秒";

      timer = setInterval(function() {
        seconds--;

        countdownBox.innerText =
          "剩餘 " + seconds + " 秒";

        if (seconds <= 0) {
          clearInterval(timer);
          finishMeasurement();
        }
      }, 1000);
    }

    function finishMeasurement() {
      /*
        展示用模擬數據。
        每次量測會隨機產生一個狀態。
      */

      const randomNumber = Math.random();

      let leftTemp;
      let rightTemp;
      let pressure;
      let risk;

      if (randomNumber < 0.55) {
        leftTemp = 31.2;
        rightTemp = 31.5;
        pressure = 320;
        risk = "normal";
      } else if (randomNumber < 0.85) {
        leftTemp = 31.4;
        rightTemp = 33.1;
        pressure = 655;
        risk = "warning";
      } else {
        leftTemp = 31.5;
        rightTemp = 34.3;
        pressure = 850;
        risk = "danger";
      }

      const difference =
        Math.abs(rightTemp - leftTemp);

      leftTempBox.innerText =
        leftTemp.toFixed(1) + "°C";

      rightTempBox.innerText =
        rightTemp.toFixed(1) + "°C";

      differenceBox.innerText =
        difference.toFixed(1) + "°C";

      pressureBox.innerText = pressure;

      dataSourceBox.innerText = "模擬";

      if (risk === "normal") {
        statusBox.className = "";

        statusBox.innerHTML = `
          低風險：數據正常
          <span class="small">
            建議維持每日足部檢查
          </span>
        `;

        tipBox.innerText =
          "請繼續每日檢查足部皮膚，保持足部清潔及乾爽。";

        setPointColor("#52b788");
      }

      if (risk === "warning") {
        statusBox.className = "warning";

        statusBox.innerHTML = `
          需要留意：建議減壓及檢查足部
          <span class="small">
            請檢查紅腫、水泡或破皮
          </span>
        `;

        tipBox.innerText =
          "請減少長時間步行，檢查右腳前掌有沒有紅腫、水泡或破皮。";

        setPointColor("#f4a261");
      }

      if (risk === "danger") {
        statusBox.className = "danger";

        statusBox.innerHTML = `
          高風險：請停止負重
          <span class="small">
            如有傷口或紅腫，請盡快聯絡醫護人員
          </span>
        `;

        tipBox.innerText =
          "請停止負重並檢查足部；如有傷口、紅腫、滲液或變色，請盡快求醫。";

        setPointColor("#e63946");
      }

      countdownBox.innerText =
        "量測完成";

      startButton.disabled = false;
    }

    startButton.addEventListener(
      "click",
      startMeasurement
    );

    resetButton.addEventListener(
      "click",
      resetPage
    );

    resetPage();
  </script>

</body>
</html>
