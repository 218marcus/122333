<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraSole 趨勢圖</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
    }

    .card {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 15px #d8d8d8;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 350px;
    }

    canvas {
      display: block;
    }

    #message {
      padding: 12px;
      color: #087f8c;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>AuraSole</h1>
    <h2>最近 7 日歷史趨勢</h2>

    <div id="message">
      正在載入圖表……
    </div>

    <div class="chart-box">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <script>
    window.addEventListener("load", function () {
      const message = document.getElementById("message");
      const canvas = document.getElementById("trendChart");

      if (typeof Chart === "undefined") {
        message.innerText =
          "錯誤：Chart.js 沒有載入，請檢查網絡連線。";
        message.style.color = "red";
        return;
      }

      const chart = new Chart(canvas, {
        type: "line",

         {
          labels: [
            "10/07",
            "10/08",
            "10/09",
            "10/10",
            "10/11",
            "10/12",
            "今天"
          ],

          datasets: [
            {
              label: "右腳溫度 °C",
               [
                31.3,
                31.4,
                31.5,
                31.8,
                32.2,
                32.7,
                33.1
              ],
              borderColor: "#e63946",
              backgroundColor: "rgba(230, 57, 70, 0.15)",
              borderWidth: 3,
              pointRadius: 5,
              tension: 0.3,
              fill: true
            },

            {
              label: "最大足底壓力",
              data: [
                300,
                320,
                350,
                410,
                520,
                655,
                700
              ],
              borderColor: "#f4a261",
              backgroundColor: "rgba(244, 162, 97, 0.15)",
              borderWidth: 3,
              pointRadius: 5,
              tension: 0.3,
              fill: false,
              yAxisID: "pressure"
            }
          ]
        },

        options: {
          responsive: true,
          maintainAspectRatio: false,

          plugins: {
            legend: {
              display: true
            },

            title: {
              display: true,
              text: "右腳溫度及足底壓力變化"
            }
          },

          scales: {
            temperature: {
              position: "left",
              min: 29,
              max: 36,
              title: {
                display: true,
                text: "溫度 °C"
              }
            },

            pressure: {
              position: "right",
              beginAtZero: true,
              title: {
                display: true,
                text: "壓力"
              },
              grid: {
                drawOnChartArea: false
              }
            },

            x: {
              title: {
                display: true,
                text: "日期"
              }
            }
          }
        }
      });

      message.innerText = "圖表載入成功";
      message.style.color = "green";
    });
  </script>

</body>
</html>
