<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuraSole Demo</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
      color: #263238;
    }

    .app {
      max-width: 850px;
      margin: auto;
    }

    header {
      padding: 28px;
      color: white;
      border-radius: 20px;
      background: linear-gradient(135deg, #087f8c, #06a77d);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    header p {
      margin: 0;
    }

    .card {
      margin-top: 18px;
      padding: 22px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 4px 15px #d9d9d9;
    }

    #status {
      padding: 18px;
      border-radius: 13px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: #b7efc5;
      color: #176b36;
    }

    .warning {
      background: #ffe69c !important;
      color: #795600 !important;
    }

    .danger {
      background: #ffb3b3 !important;
      color: #8b0000 !important;
    }

    .status-small {
      display: block;
      margin-top: 7px;
      font-size: 14px;
      font-weight: normal;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .foot {
      position: relative;
      width: 150px;
      height: 275px;
      margin: 20px auto;
      border: 4px solid #d5b59c;
      border-radius: 75px 75px 45px 45px;
      background: #ead2bd;
    }

    .point {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 3px solid white;
      border-radius: 50%;
      background: #52b788;
      transition: 0.4s;
    }

    #toe {
      top: 25px;
      left: 57px;
    }

    #met1 {
      top: 90px;
      left: 28px;
    }

    #met5 {
      top: 90px;
      right: 22px;
    }

    #heel {
      bottom: 25px;
      left: 57px;
    }

    .data {
      line-height: 2.2;
      font-size: 16px;
    }

    .data span {
      float: right;
      font-weight: bold;
      color: #087f8c;
    }

    .chart {
      height: 270px;
    }

    .tip {
      line-height: 1.7;
      color: #555;
    }

    .small {
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      body {
        padding: 10px;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>AuraSole</h1>
      <p>糖尿病足日常風險監測原型</p>
    </header>

    <section class="card">
      <div id="status">
        低風險：數據正常
        <span class="status-small">
          系統正在自動更新模擬數據
        </span>
      </div>
    </section>

    <div class="dashboard">

      <section class="card">
        <h2>DFU Risk Map</h2>

        <div class="foot">
          <div id="toe" class="point"></div>
          <div id="met1" class="point"></div>
          <div id="met5" class="point"></div>
          <div id="heel" class="point"></div>
        </div>

        <p class="small">
          綠色：正常　黃色：需留意　紅色：高風險
        </p>
      </section>

      <section class="card">
        <h2>即時數據</h2>

        <div class="data">
          左腳溫度：<span id="left">31.2°C</span><br>
          右腳溫度：<span id="right">31.5°C</span><br>
          左右溫差：<span id="difference">0.3°C</span><br>
          最大壓力：<span id="pressure">320</span><br>
          系統狀態：<span id="mode">正常</span>
        </div>
      </section>

    </div>

    <section class="card">
      <h2>最近 7 日歷史趨勢</h2>

      <div class="chart">
        <canvas id="trendChart"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>系統建議</h2>

      <p id="tip" class="tip">
        請繼續每日檢查足部皮膚，保持足部清潔及乾爽。
      </p>

      <p class="small">
        本頁面為展示原型，數據為模擬資料，不構成醫療診斷。
      </p>
    </section>

  </div>

  <script>
    const status = document.getElementById("status");
    const left = document.getElementById("left");
    const right = document.getElementById("right");
    const difference = document.getElementById("difference");
    const pressure = document.getElementById("pressure");
    const mode = document.getElementById("mode");
    const tip = document.getElementById("tip");

    const points = document.querySelectorAll(".point");

    const states = [
      {
        name: "normal",
        title: "低風險：數據正常",
        subtitle: "建議維持每日足部檢查",
        left: 31.2,
        right: 31.5,
        pressure: 320,
        tip: "請繼續每日檢查足部皮膚，保持足部清潔及乾爽。",
        color: "#52b788",
        chartRight: [31.3, 31.4, 31.5, 31.4, 31.5, 31.4, 31.5],
        chartPressure: [300, 320, 350, 310, 330, 320, 320]
      },

      {
        name: "warning",
        title: "需要留意：建議減壓及檢查足部",
        subtitle: "請檢查有沒有紅腫、水泡或破皮",
        left: 31.4,
        right: 33.1,
        pressure: 655,
        tip: "請減少長時間步行，檢查右腳前掌有沒有紅腫、水泡或破皮。",
        color: "#f4a261",
        chartRight: [31.4, 31.5, 31.6, 31.8, 32.2, 32.7, 33.1],
        chartPressure: [320, 350, 410, 450, 520, 580, 655]
      },

      {
        name: "danger",
        title: "高風險：請停止負重並聯絡醫護人員",
        subtitle: "如有傷口、紅腫或滲液，請盡快求醫",
        left: 31.5,
        right: 34.3,
        pressure: 850,
        tip: "請停止負重並檢查足部；如有傷口、紅腫、滲液或變色，請盡快聯絡醫護人員。",
        color: "#e63946",
        chartRight: [31.4, 31.5, 31.8, 32.1, 32.8, 33.7, 34.3],
        chartPressure: [320, 380, 450, 550, 650, 760, 850]
      }
    ];

    let current = 0;

    const chart = new Chart(
      document.getElementById("trendChart"),
      {
        type: "line",

         {
          labels: [
            "10/07",
            "10/08",
            "10/09",
            "10/10",
            "10/11",
            "10/12",
            "今天"
          ],

          datasets: [
            {
              label: "右腳溫度 °C",
               states[0].chartRight,
              borderColor: "#e63946",
              borderWidth: 3,
              tension: 0.3,
              yAxisID: "temperature"
            },

            {
              label: "最大壓力",
               states[0].chartPressure,
              borderColor: "#f4a261",
              borderWidth: 3,
              tension: 0.3,
              yAxisID: "pressure"
            }
          ]
        },

        options: {
          responsive: true,
          maintainAspectRatio: false,

          scales: {
            temperature: {
              position: "left",
              title: {
                display: true,
                text: "溫度 °C"
              },
              min: 29,
              max: 36
            },

            pressure: {
              position: "right",
              title: {
                display: true,
                text: "壓力"
              },
              beginAtZero: true,
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      }
    );

    function updatePage() {
      const state = states[current];

      status.className = "";

      if (state.name === "warning") {
        status.classList.add("warning");
      }

      if (state.name === "danger") {
        status.classList.add("danger");
      }

      status.innerHTML =
        state.title +
        '<span class="status-small">' +
        state.subtitle +
        "</span>";

      left.innerText = state.left.toFixed(1) + "°C";
      right.innerText = state.right.toFixed(1) + "°C";
      difference.innerText =
        Math.abs(state.right - state.left).toFixed(1) + "°C";
      pressure.innerText = state.pressure;
      mode.innerText =
        state.name === "normal"
          ? "正常"
          : state.name === "warning"
          ? "需留意"
          : "高風險";
      tip.innerText = state.tip;

      points.forEach(function(point) {
        point.style.background = state.color;
      });

      chart.data.datasets[0].data = state.chartRight;
      chart.data.datasets[1].data = state.chartPressure;
      chart.update();

      current++;

      if (current >= states.length) {
        current = 0;
      }
    }

    updatePage();

    setInterval(updatePage, 3000);
  </script>

</body>
</html>
