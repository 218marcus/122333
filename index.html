<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Line Chart Test</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
    }

    .chart-box {
      width: 100%;
      max-width: 800px;
      height: 400px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <h1>Pressure Trend Test</h1>

  <div class="chart-box">
    <canvas id="pressureChart"></canvas>
  </div>

  <script>
    const canvas =
      document.getElementById(
        "pressureChart"
      );

    if (typeof Chart === "undefined") {
      document.body.innerHTML += `
        <p style="color:red;">
          Chart.js failed to load.
        </p>
      `;
    } else {
      new Chart(
        canvas,
        {
          type: "line",

           {
            labels: [
              "09:00",
              "09:01",
              "09:02",
              "09:03",
              "09:04",
              "09:05"
            ],

            datasets: [
              {
                label: "Pressure",
                 [
                  250,
                  380,
                  420,
                  610,
                  520,
                  700
                ],
                borderColor: "#087f8c",
                backgroundColor:
                  "rgba(8, 127, 140, 0.15)",
                borderWidth: 3,
                pointRadius: 5,
                tension: 0.3,
                fill: true
              }
            ]
          },

          options: {
            responsive: true,
            maintainAspectRatio: false,

            scales: {
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: "Pressure"
                }
              },

              x: {
                title: {
                  display: true,
                  text: "Time"
                }
              }
            }
          }
        }
      );
    }
  </script>

</body>

</html>
