<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AuraSole｜Arduino 連接版</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f2f5f7;
      color: #263238;
    }

    .app {
      max-width: 900px;
      margin: auto;
    }

    header {
      padding: 28px;
      color: white;
      border-radius: 20px;
      background: linear-gradient(135deg, #087f8c, #06a77d);
      box-shadow: 0 6px 20px rgba(8, 127, 140, 0.2);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    header p {
      margin: 0;
      line-height: 1.6;
    }

    .card {
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 14px #d8d8d8;
    }

    .card h2 {
      margin-top: 0;
      color: #087f8c;
    }

    #status {
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      background: #d9f7e5;
      color: #176b36;
      transition: 0.3s;
    }

    #status.warning {
      background: #ffe69c;
      color: #795600;
    }

    #status.danger {
      background: #ffb3b3;
      color: #8b0000;
    }

    #status.measuring {
      background: #d9edf7;
      color: #087f8c;
    }

    .small {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: normal;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }

    #connectButton {
      color: white;
      background: #087f8c;
    }

    #startButton {
      color: white;
      background: #06a77d;
    }

    #resetButton {
      background: #e5e7eb;
      color: #263238;
    }

    #countdown {
      margin-top: 15px;
      text-align: center;
      color: #087f8c;
      font-size: 20px;
      font-weight: bold;
    }

    #connectionStatus {
      margin: 12px 0 0;
      text-align: center;
      color: #667085;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .foot {
      position: relative;
      width: 160px;
      height: 285px;
      margin: 22px auto;
      border: 4px solid #d5b59c;
      border-radius: 80px 80px 48px 48px;
      background: #ead2bd;
    }

    .point {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 3px solid white;
      border-radius: 50%;
      background: #a8b0b5;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.2);
      transition: 0.4s;
    }

    #toe {
      top: 27px;
      left: 61px;
    }

    #met1 {
      top: 94px;
      left: 30px;
    }

    #met5 {
      top: 94px;
      right: 23px;
    }

    #heel {
      bottom: 26px;
      left: 61px;
    }

    .point-label {
      position: absolute;
      width: 100px;
      color: #604734;
      text-align: center;
      font-size: 11px;
    }

    #toeLabel {
      top: 4px;
      left: 102px;
    }

    #met1Label {
      top: 100px;
      left: -91px;
    }

    #met5Label {
      top: 100px;
      left: 95px;
    }

    #heelLabel {
      bottom: 33px;
      left: 102px;
    }

    .legend {
      color: #667085;
      font-size: 13px;
      line-height: 1.8;
    }

    .data {
      line-height: 2.3;
      font-size: 16px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid #edf0f2;
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .data-value {
      color: #087f8c;
      font-weight: bold;
    }

    .tip {
      color: #555;
      line-height: 1.8;
    }

    .notice {
      color: #777;
      font-size: 13px;
      line-height: 1.7;
    }

    .status-online {
      color: #176b36 !important;
    }

    .status-offline {
      color: #b42318 !important;
    }

    @media (max-width: 650px) {
      body {
        padding: 10px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <h1>AuraSole</h1>
      <p>糖尿病足日常風險監測原型</p>
      <p class="small">
        第二階段：Arduino USB 即時數據版本
      </p>
    </header>

    <section class="card">
      <h2>系統狀態</h2>

      <div id="status">
        尚未量測
        <span class="small">
          請先連接 Arduino，或直接使用模擬模式
        </span>
      </div>

      <div class="controls">
        <button id="connectButton">
          連接 Arduino
        </button>

        <button id="startButton">
          開始量測
        </button>

        <button id="resetButton">
          重新設定
        </button>
      </div>

      <p id="connectionStatus" class="status-offline">
        Arduino 尚未連接
      </p>

      <div id="countdown"></div>
    </section>

    <div class="grid">

      <section class="card">
        <h2>DFU Risk Map</h2>

        <div class="foot">
          <div id="toe" class="point"></div>
          <div id="met1" class="point"></div>
          <div id="met5" class="point"></div>
          <div id="heel" class="point"></div>

          <div id="toeLabel" class="point-label">
            大拇趾
          </div>

          <div id="met1Label" class="point-label">
            第一蹠骨
          </div>

          <div id="met5Label" class="point-label">
            第五蹠骨
          </div>

          <div id="heelLabel" class="point-label">
            腳跟
          </div>
        </div>

        <p class="legend">
          灰色：未量測<br>
          綠色：正常<br>
          黃色：需要留意<br>
          紅色：高風險
        </p>
      </section>

      <section class="card">
        <h2>即時數據</h2>

        <div class="data">

          <div class="data-row">
            <span>左腳溫度</span>
            <span id="leftTemp" class="data-value">
              --
            </span>
          </div>

          <div class="data-row">
            <span>右腳溫度</span>
            <span id="rightTemp" class="data-value">
              --
            </span>
          </div>

          <div class="data-row">
            <span>左右溫差</span>
            <span id="tempDifference" class="data-value">
              --
            </span>
          </div>

          <div class="data-row">
            <span>最大壓力</span>
            <span id="maxPressure" class="data-value">
              --
            </span>
          </div>

          <div class="data-row">
            <span>數據來源</span>
            <span id="dataSource" class="data-value">
              尚未開始
            </span>
          </div>

          <div class="data-row">
            <span>更新時間</span>
            <span id="lastUpdate" class="data-value">
              --
            </span>
          </div>

        </div>
      </section>

    </div>

    <section class="card">
      <h2>系統建議</h2>

      <p id="tip" class="tip">
        尚未進行量測。
      </p>

      <p class="notice">
        本頁面為概念展示原型。壓力門檻、溫度換算和風險分類
        尚未經過醫療臨床驗證，不可用作醫療診斷。
      </p>
    </section>

  </main>

  <script>
    /*
      =========================
      1. 取得 HTML 元素
      =========================
    */

    const connectButton =
      document.getElementById("connectButton");

    const startButton =
      document.getElementById("startButton");

    const resetButton =
      document.getElementById("resetButton");

    const statusBox =
      document.getElementById("status");

    const countdownBox =
      document.getElementById("countdown");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const leftTempBox =
      document.getElementById("leftTemp");

    const rightTempBox =
      document.getElementById("rightTemp");

    const differenceBox =
      document.getElementById("tempDifference");

    const pressureBox =
      document.getElementById("maxPressure");

    const dataSourceBox =
      document.getElementById("dataSource");

    const lastUpdateBox =
      document.getElementById("lastUpdate");

    const tipBox =
      document.getElementById("tip");

    const points = [
      document.getElementById("toe"),
      document.getElementById("met1"),
      document.getElementById("met5"),
      document.getElementById("heel")
    ];

    /*
      =========================
      2. 系統變數
      =========================
    */

    let serialPort = null;
    let serialReader = null;
    let measuringTimer = null;
    let secondsLeft = 0;
    let latestArduinoData = null;

    /*
      =========================
      3. 顏色控制
      =========================
    */

    function setPointColor(color) {
      points.forEach(function(point) {
        point.style.background = color;
      });
    }

    /*
      =========================
      4. 連接 Arduino
      =========================
    */

    connectButton.addEventListener(
      "click",
      connectArduino
    );

    async function connectArduino() {
      if (!("serial" in navigator)) {
        connectionStatus.innerText =
          "此瀏覽器不支援 Web Serial，請使用 Chrome 或 Edge。";

        connectionStatus.className =
          "status-offline";

        return;
      }

      try {
        connectionStatus.innerText =
          "請選擇 Arduino 序列埠……";

        serialPort =
          await navigator.serial.requestPort();

        await serialPort.open({
          baudRate: 9600
        });

        connectionStatus.innerText =
          "Arduino 已連接，等待數據……";

        connectionStatus.className =
          "status-online";

        dataSourceBox.innerText =
          "Arduino USB";

        connectButton.disabled =
          true;

        readArduinoData();

      } catch (error) {
        connectionStatus.innerText =
          "連接失敗：" + error.message;

        connectionStatus.className =
          "status-offline";
      }
    }

    /*
      =========================
      5. 讀取 Arduino Serial
      =========================
    */

    async function readArduinoData() {
      const decoder =
        new TextDecoderStream();

      serialPort.readable.pipeTo(
        decoder.writable
      );

      serialReader =
        decoder.readable.getReader();

      let buffer = "";

      try {
        while (true) {
          const result =
            await serialReader.read();

          if (result.done) {
            break;
          }

          buffer += result.value;

          const lines =
            buffer.split("\n");

          buffer =
            lines.pop();

          for (const line of lines) {
            processArduinoLine(
              line.trim()
            );
          }
        }
      } catch (error) {
        connectionStatus.innerText =
          "Arduino 數據讀取中斷";

        connectionStatus.className =
          "status-offline";
      }
    }

    /*
      =========================
      6. 解析 Arduino JSON
      =========================
    */

    function processArduinoLine(line) {
      if (!line) {
        return;
      }

      try {
        const data =
          JSON.parse(line);

        if (
          typeof data.pressure !== "number" ||
          typeof data.temperature !== "number"
        ) {
          return;
        }

        latestArduinoData =
          data;

        connectionStatus.innerText =
          "Arduino 已連接，正在接收數據";

        connectionStatus.className =
          "status-online";

        if (measuringTimer === null) {
          updateLiveData(
            data.pressure,
            data.temperature
          );
        }

      } catch (error) {
        console.log(
          "無法解析 Arduino 數據：",
          line
        );
      }
    }

    /*
      =========================
      7. 顯示即時數據
      =========================
    */

    function updateLiveData(
      pressure,
      rightTemperature
    ) {
      const leftTemperature =
        31.2;

      const difference =
        Math.abs(
          rightTemperature -
          leftTemperature
        );

      leftTempBox.innerText =
        leftTemperature.toFixed(1) + "°C";

      rightTempBox.innerText =
        rightTemperature.toFixed(1) + "°C";

      differenceBox.innerText =
        difference.toFixed(1) + "°C";

      pressureBox.innerText =
        Math.round(pressure);

      dataSourceBox.innerText =
        "Arduino USB";

      lastUpdateBox.innerText =
        new Date().toLocaleTimeString(
          "zh-HK"
        );

      updateRisk(
        pressure,
        rightTemperature,
        difference
      );
    }

    /*
      =========================
      8. 判斷風險
      =========================
    */

    function updateRisk(
      pressure,
      rightTemperature,
      difference
    ) {
      let risk =
        "normal";

      if (
        pressure >= 800 ||
        difference >= 2.5
      ) {
        risk =
          "danger";
      } else if (
        pressure >= 600 ||
        difference >= 1.5
      ) {
        risk =
          "warning";
      }

      statusBox.className =
        "";

      if (risk === "normal") {
        statusBox.innerHTML = `
          低風險：數據正常
          <span class="small">
            建議維持每日足部檢查
          </span>
        `;

        tipBox.innerText =
          "請繼續每日檢查足部皮膚，保持足部清潔及乾爽。";

        setPointColor(
          "#52b788"
        );
      }

      if (risk === "warning") {
        statusBox.className =
          "warning";

        statusBox.innerHTML = `
          需要留意：建議減壓及檢查足部
          <span class="small">
            請檢查有沒有紅腫、水泡或破皮
          </span>
        `;

        tipBox.innerText =
          "請減少長時間步行，並檢查右腳前掌有沒有紅腫、水泡或破皮。";

        setPointColor(
          "#f4a261"
        );
      }

      if (risk === "danger") {
        statusBox.className =
          "danger";

        statusBox.innerHTML = `
          高風險：請停止負重
          <span class="small">
            如有傷口或紅腫，請盡快聯絡醫護人員
          </span>
        `;

        tipBox.innerText =
          "請停止負重並檢查足部；如有傷口、紅腫、滲液或變色，請盡快求醫。";

        setPointColor(
          "#e63946"
        );
      }
    }

    /*
      =========================
      9. 開始量測
      =========================
    */

    startButton.addEventListener(
      "click",
      startMeasurement
    );

    function startMeasurement() {
      clearInterval(
        measuringTimer
      );

      secondsLeft =
        10;

      startButton.disabled =
        true;

      statusBox.className =
        "measuring";

      statusBox.innerHTML = `
        正在量測
        <span class="small">
          請保持坐姿並避免移動
        </span>
      `;

      countdownBox.innerText =
        "剩餘 " + secondsLeft + " 秒";

      setPointColor(
        "#087f8c"
      );

      measuringTimer =
        setInterval(function() {
          secondsLeft--;

          countdownBox.innerText =
            "剩餘 " + secondsLeft + " 秒";

          if (secondsLeft <= 0) {
            clearInterval(
              measuringTimer
            );

            measuringTimer =
              null;

            finishMeasurement();
          }
        }, 1000);
    }

    /*
      =========================
      10. 完成量測
      =========================
    */

    function finishMeasurement() {
      startButton.disabled =
        false;

      countdownBox.innerText =
        "量測完成";

      if (latestArduinoData !== null) {
        updateLiveData(
          latestArduinoData.pressure,
          latestArduinoData.temperature
        );

        dataSourceBox.innerText =
          "Arduino USB";

        return;
      }

      /*
        如果未連接 Arduino，
        使用模擬數據完成展示。
      */

      const random =
        Math.random();

      let pressure;
      let temperature;

      if (random < 0.55) {
        pressure =
          320;

        temperature =
          31.5;
      } else if (random < 0.85) {
        pressure =
          655;

        temperature =
          33.1;
      } else {
        pressure =
          850;

        temperature =
          34.3;
      }

      dataSourceBox.innerText =
        "模擬數據";

      updateLiveData(
        pressure,
        temperature
      );
    }

    /*
      =========================
      11. 重新設定
      =========================
    */

    resetButton.addEventListener(
      "click",
      resetPage
    );

    function resetPage() {
      clearInterval(
        measuringTimer
      );

      measuringTimer =
        null;

      secondsLeft =
        0;

      latestArduinoData =
        null;

      startButton.disabled =
        false;

      statusBox.className =
        "";

      statusBox.innerHTML = `
        尚未量測
        <span class="small">
          請先連接 Arduino，或直接使用模擬模式
        </span>
      `;

      countdownBox.innerText =
        "";

      leftTempBox.innerText =
        "--";

      rightTempBox.innerText =
        "--";

      differenceBox.innerText =
        "--";

      pressureBox.innerText =
        "--";

      dataSourceBox.innerText =
        "尚未開始";

      lastUpdateBox.innerText =
        "--";

      tipBox.innerText =
        "尚未進行量測。";

      setPointColor(
        "#a8b0b5"
      );
    }
  </script>

</body>
</html>
