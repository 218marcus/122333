<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">

  <title>Chart Test</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
    }

    h1 {
      color: #087f8c;
      text-align: center;
    }

    #message {
      max-width: 800px;
      margin: 15px auto;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      background: #fff3cd;
      color: #664d03;
    }

    .chart-box {
      position: relative;
      width: 90%;
      max-width: 800px;
      height: 400px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px #cccccc;
    }
  </style>
</head>

<body>

  <h1>Pressure Trend Test</h1>

  <div id="message">
    Loading Chart.js...
  </div>

  <div class="chart-box">
    <canvas id="myChart"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>

  <script>
    const message =
      document.getElementById("message");

    const canvas =
      document.getElementById("myChart");

    if (typeof Chart === "undefined") {
      message.innerText =
        "ERROR: Chart.js did not load.";

      message.style.background =
        "#f8d7da";

      message.style.color =
        "#842029";
    } else {
      new Chart(
        canvas,
        {
          type: "line",

           {
            labels: [
              "09:00",
              "09:01",
              "09:02",
              "09:03",
              "09:04",
              "09:05"
            ],

            datasets: [
              {
                label: "Pressure",
                 [
                  200,
                  350,
                  450,
                  600,
                  520,
                  720
                ],
                borderColor: "#087f8c",
                backgroundColor:
                  "rgba(8, 127, 140, 0.2)",
                borderWidth: 4,
                pointRadius: 6,
                pointBackgroundColor:
                  "#e63946",
                tension: 0.3,
                fill: true
              }
            ]
          },

          options: {
            responsive: true,
            maintainAspectRatio: false,

            scales: {
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: "Pressure"
                }
              },

              x: {
                title: {
                  display: true,
                  text: "Time"
                }
              }
            }
          }
        }
      );

      message.innerText =
        "Chart loaded successfully.";

      message.style.background =
        "#d1e7dd";

      message.style.color =
        "#0f5132";
    }
  </script>

</body>
</html>
