<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>AuraSole</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
      color: #263238;
    }

    .app {
      max-width: 850px;
      margin: auto;
    }

    header {
      padding: 28px;
      border-radius: 20px;
      color: white;
      background: linear-gradient(
        135deg,
        #087f8c,
        #06a77d
      );
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      line-height: 1.6;
    }

    .card {
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 15px #d8d8d8;
    }

    .card h2 {
      margin-top: 0;
      color: #087f8c;
    }

    #status {
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      background: #b7efc5;
      color: #176b36;
    }

    #status.warning {
      background: #ffe69c;
      color: #795600;
    }

    #status.danger {
      background: #ffb3b3;
      color: #8b0000;
    }

    .small {
      display: block;
      margin-top: 7px;
      font-size: 14px;
      font-weight: normal;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .foot {
      position: relative;
      width: 150px;
      height: 275px;
      margin: 20px auto;
      border: 4px solid #d5b59c;
      border-radius: 75px 75px 45px 45px;
      background: #ead2bd;
    }

    .point {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 3px solid white;
      border-radius: 50%;
      background: #52b788;
      transition: 0.4s;
    }

    #toe {
      top: 25px;
      left: 57px;
    }

    #met1 {
      top: 90px;
      left: 28px;
    }

    #met5 {
      top: 90px;
      right: 22px;
    }

    #heel {
      bottom: 25px;
      left: 57px;
    }

    .data {
      line-height: 2.2;
    }

    .data span {
      float: right;
      font-weight: bold;
      color: #087f8c;
    }

    .chart-box {
      width: 100%;
      overflow-x: auto;
    }

    /*
      The chart box keeps the original height.
      The data trend is adjusted instead.
    */
    #chart {
      display: block;
      width: 100%;
      min-width: 620px;
      height: 300px;
      border-bottom: 1px solid #ddd;
    }

    .legend {
      color: #555;
      line-height: 2;
      font-size: 14px;
    }

    .line-red {
      color: #e63946;
    }

    .line-orange {
      color: #f4a261;
    }

    .tip {
      color: #555;
      line-height: 1.7;
    }

    @media (max-width: 650px) {
      body {
        padding: 10px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      #chart {
        min-width: 620px;
        height: 280px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <h1>AuraSole</h1>

      <p>
        糖尿病足日常風險監測原型
      </p>
    </header>

    <section class="card">

      <div id="status">
        低風險：數據正常

        <span class="small">
          建議維持每日足部檢查
        </span>
      </div>

    </section>

    <div class="grid">

      <section class="card">

        <h2>DFU Risk Map</h2>

        <div class="foot">
          <div id="toe" class="point"></div>
          <div id="met1" class="point"></div>
          <div id="met5" class="point"></div>
          <div id="heel" class="point"></div>
        </div>

        <p class="legend">
          綠色：正常<br>
          黃色：需要留意<br>
          紅色：高風險
        </p>

      </section>

      <section class="card">

        <h2>即時數據</h2>

        <div class="data">

          左腳溫度：
          <span id="left">
            31.2°C
          </span>
          <br>

          右腳溫度：
          <span id="right">
            31.5°C
          </span>
          <br>

          左右溫差：
          <span id="difference">
            0.3°C
          </span>
          <br>

          最大壓力：
          <span id="pressure">
            320
          </span>
          <br>

          狀態：
          <span id="mode">
            正常
          </span>

        </div>

      </section>

    </div>

    <section class="card">

      <h2>最近 7 日歷史趨勢</h2>

      <div class="chart-box">

        <svg
          id="chart"
          viewBox="0 0 700 320"
          preserveAspectRatio="none">
        </svg>

      </div>

      <p class="legend">

        <span class="line-red">
          ━ 右腳溫度
        </span>

        <span class="line-orange">
          ━ 最大足底壓力
        </span>

      </p>

    </section>

    <section class="card">

      <h2>系統建議</h2>

      <p id="tip" class="tip">
        請繼續每日檢查足部皮膚，
        保持足部清潔及乾爽。
      </p>

    </section>

  </main>

  <script>
    const statusBox =
      document.getElementById("status");

    const leftBox =
      document.getElementById("left");

    const rightBox =
      document.getElementById("right");

    const differenceBox =
      document.getElementById("difference");

    const pressureBox =
      document.getElementById("pressure");

    const modeBox =
      document.getElementById("mode");

    const tipBox =
      document.getElementById("tip");

    const chart =
      document.getElementById("chart");

    const points =
      document.querySelectorAll(".point");

    /*
      The simulated data is intentionally smoother.
      Adjacent values change gradually.
    */
    const states = [

      {
        type: "normal",

        title:
          "低風險：數據正常",

        subtitle:
          "建議維持每日足部檢查",

        left: 31.2,

        right: 31.5,

        pressure: 320,

        tip:
          "請繼續每日檢查足部皮膚，保持足部清潔及乾爽。",

        color:
          "#52b788",

        temperature: [
          31.3,
          31.4,
          31.4,
          31.5,
          31.5,
          31.6,
          31.5
        ],

        pressureData: [
          300,
          310,
          318,
          320,
          325,
          318,
          320
        ]
      },

      {
        type: "warning",

        title:
          "需要留意：建議減壓及檢查足部",

        subtitle:
          "請檢查有沒有紅腫、水泡或破皮",

        left: 31.4,

        right: 32.8,

        pressure: 655,

        tip:
          "請減少長時間步行，檢查右腳前掌有沒有紅腫、水泡或破皮。",

        color:
          "#f4a261",

        temperature: [
          31.5,
          31.6,
          31.7,
          31.9,
          32.1,
          32.4,
          32.8
        ],

        pressureData: [
          470,
          490,
          515,
          540,
          575,
          615,
          655
        ]
      },

      {
        type: "danger",

        title:
          "高風險：請停止負重並聯絡醫護人員",

        subtitle:
          "如有傷口、紅腫或滲液，請盡快求醫",

        left: 31.5,

        right: 34.0,

        pressure: 850,

        tip:
          "請停止負重並檢查足部；如有傷口、紅腫、滲液或變色，請盡快聯絡醫護人員。",

        color:
          "#e63946",

        temperature: [
          32.2,
          32.4,
          32.7,
          33.0,
          33.3,
          33.7,
          34.0
        ],

        pressureData: [
          700,
          720,
          745,
          770,
          795,
          825,
          850
        ]
      }

    ];

    function makePoints(
      values,
      min,
      max
    ) {
      const chartWidth =
        700;

      const chartHeight =
        320;

      const left =
        55;

      const right =
        20;

      const top =
        30;

      const bottom =
        45;

      const width =
        chartWidth -
        left -
        right;

      const height =
        chartHeight -
        top -
        bottom;

      return values.map(
        function(value, index) {
          const x =
            left +
            index *
            (
              width /
              (values.length - 1)
            );

          const y =
            top +
            (
              (max - value) /
              (max - min)
            ) *
            height;

          return {
            x: x,
            y: y
          };
        }
      );
    }

    function pointsToString(
      pointList
    ) {
      return pointList
        .map(
          function(point) {
            return point.x +
              "," +
              point.y;
          }
        )
        .join(" ");
    }

    function drawChart(
      state
    ) {
      const labels = [
        "10/07",
        "10/08",
        "10/09",
        "10/10",
        "10/11",
        "10/12",
        "今天"
      ];

      const tempPoints =
        makePoints(
          state.temperature,
          29,
          36
        );

      const pressurePoints =
        makePoints(
          state.pressureData,
          0,
          900
        );

      let html =
        "";

      html += `
        <line
          x1="55"
          y1="30"
          x2="55"
          y2="275"
          stroke="#999"
          stroke-width="1"
        />

        <line
          x1="55"
          y1="275"
          x2="680"
          y2="275"
          stroke="#999"
          stroke-width="1"
        />

        <text
          x="10"
          y="38"
          font-size="12">
          36°C
        </text>

        <text
          x="10"
          y="158"
          font-size="12">
          32°C
        </text>

        <text
          x="10"
          y="278"
          font-size="12">
          29°C
        </text>

        <text
          x="640"
          y="38"
          font-size="12">
          900
        </text>

        <text
          x="640"
          y="158"
          font-size="12">
          450
        </text>

        <text
          x="640"
          y="278"
          font-size="12">
          0
        </text>

        <polyline
          points="${pointsToString(tempPoints)}"
          fill="none"
          stroke="#e63946"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <polyline
          points="${pointsToString(pressurePoints)}"
          fill="none"
          stroke="#f4a261"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      `;

      tempPoints.forEach(
        function(point) {
          html += `
            <circle
              cx="${point.x}"
              cy="${point.y}"
              r="4"
              fill="#e63946"
            />
          `;
        }
      );

      pressurePoints.forEach(
        function(point) {
          html += `
            <circle
              cx="${point.x}"
              cy="${point.y}"
              r="4"
              fill="#f4a261"
            />
          `;
        }
      );

      labels.forEach(
        function(label, index) {
          const x =
            55 +
            index *
            (625 / 6);

          html += `
            <text
              x="${x}"
              y="300"
              text-anchor="middle"
              font-size="12">
              ${label}
            </text>
          `;
        }
      );

      chart.innerHTML =
        html;
    }

    function updatePage() {
      const state =
        states[
          Math.floor(
            Date.now() / 3000
          ) %
          states.length
        ];

      statusBox.className =
        "";

      if (
        state.type === "warning"
      ) {
        statusBox.classList.add(
          "warning"
        );
      }

      if (
        state.type === "danger"
      ) {
        statusBox.classList.add(
          "danger"
        );
      }

      statusBox.innerHTML = `
        ${state.title}

        <span class="small">
          ${state.subtitle}
        </span>
      `;

      leftBox.innerText =
        state.left.toFixed(1) +
        "°C";

      rightBox.innerText =
        state.right.toFixed(1) +
        "°C";

      differenceBox.innerText =
        Math.abs(
          state.right -
          state.left
        ).toFixed(1) +
        "°C";

      pressureBox.innerText =
        state.pressure;

      modeBox.innerText =
        state.type === "normal"
          ? "正常"
          : state.type === "warning"
          ? "需留意"
          : "高風險";

      tipBox.innerText =
        state.tip;

      points.forEach(
        function(point) {
          point.style.background =
            state.color;
        }
      );

      drawChart(state);
    }

    updatePage();

    setInterval(
      updatePage,
      3000
    );
  </script>

</body>

</html>
